name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    # Pushes to main publish the MinVer-derived prerelease; a v* tag or a manual
    # run publishes the stable release.
    name: Publish to NuGet.org
    runs-on: ubuntu-latest

    permissions:
      # Required to request the OIDC token NuGet.org exchanges for a
      # short-lived API key (Trusted Publishing).
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer derives the version from the full history and tags.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EvilHop.slnx

      - name: Build
        run: dotnet build EvilHop.slnx --configuration Release --no-restore

      - name: Pack
        run: dotnet pack EvilHop.slnx --configuration Release --no-build --output ./artifacts

      # Requested last: the issued API key is only valid for about an hour.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Suprnova

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source ${{ env.NUGET_SOURCE }}
          --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
