name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer derives the version from the full history and tags.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EvilHop.slnx

      - name: Verify formatting
        run: dotnet format EvilHop.slnx --verify-no-changes

      - name: Build
        run: dotnet build EvilHop.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test EvilHop.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Coverage summary (informational only)
        # Coverage is reported, never enforced: this step must not fail the job.
        if: always()
        continue-on-error: true
        run: |
          shopt -s globstar nullglob
          reports=(./TestResults/**/coverage.cobertura.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No coverage report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Code coverage"
            echo
            echo "| Report | Line rate | Branch rate |"
            echo "| --- | --- | --- |"
            for report in "${reports[@]}"; do
              line=$(sed -n 's/.*line-rate="\([^"]*\)".*/\1/p' "$report" | head -n 1)
              branch=$(sed -n 's/.*branch-rate="\([^"]*\)".*/\1/p' "$report" | head -n 1)
              printf '| %s | %s%% | %s%% |\n' \
                "$report" \
                "$(awk -v v="$line" 'BEGIN { printf "%.1f", v * 100 }')" \
                "$(awk -v v="$branch" 'BEGIN { printf "%.1f", v * 100 }')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack EvilHop.slnx --configuration Release --no-build --output ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
