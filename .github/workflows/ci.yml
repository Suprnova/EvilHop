name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer derives the version from the full history and tags.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EvilHop.slnx

      - name: Verify formatting
        run: dotnet format EvilHop.slnx --verify-no-changes

      - name: Build
        run: dotnet build EvilHop.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test EvilHop.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack EvilHop.slnx --configuration Release --no-build --output ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
